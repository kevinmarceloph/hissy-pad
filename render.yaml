# Render blueprint: the web app is a static site (no server, no free-tier sleep).
# Build runs from the repo root so the workspace package @hissypad/core resolves.
services:
  - type: web
    name: hissypad
    runtime: static
    # Render provisions pnpm itself from the root package.json's packageManager field;
    # corepack enable fails there (/usr/bin is read-only).
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @hissypad/web build
    staticPublishPath: apps/web/dist
    headers:
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /manifest.webmanifest
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
